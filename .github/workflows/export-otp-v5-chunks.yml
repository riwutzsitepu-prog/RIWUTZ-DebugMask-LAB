name: Export OTP V5 Chunks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-otp-v5-chunks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export APK as text chunks
        shell: bash
        run: |
          set -euo pipefail
          test -s OTP_Litensi_V5_FAST_CLIPBOARD.apk
          rm -f OTP_V5_B64_*
          base64 -w0 OTP_Litensi_V5_FAST_CLIPBOARD.apk > OTP_V5_FULL.b64
          split -b 12000 -d -a 3 OTP_V5_FULL.b64 OTP_V5_B64_
          rm OTP_V5_FULL.b64
          printf '%s\n' "$(ls OTP_V5_B64_* | wc -l)" > OTP_V5_B64_COUNT.txt
          sha256sum OTP_Litensi_V5_FAST_CLIPBOARD.apk > OTP_V5_B64_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OTP_V5_B64_* OTP_V5_B64_COUNT.txt OTP_V5_B64_SHA256.txt
          git commit -m 'export OTP V5 chunks' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
