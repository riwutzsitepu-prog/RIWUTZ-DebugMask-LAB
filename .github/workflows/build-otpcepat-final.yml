name: Build OTP Cepat FINAL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-otpcepat-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf otpcepat
          mkdir -p otpcepat/app/src/main/java/com/riwutz/otpcepat
          mkdir -p otpcepat/app/src/main/res/values otpcepat/app/src/main/res/drawable-nodpi otpcepat/app/src/main/res/mipmap-anydpi otpcepat/app/src/main/res/mipmap-anydpi-v26

          cat > otpcepat/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='OTPCepat'
          include ':app'
          EOF

          cat > otpcepat/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > otpcepat/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.riwutz.otpcepat'
            compileSdk 35
            defaultConfig { applicationId 'com.riwutz.otpcepat'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' }
            buildTypes { release { minifyEnabled false; shrinkResources false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          EOF

          cat > otpcepat/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application
              android:allowBackup="true"
              android:hardwareAccelerated="true"
              android:usesCleartextTraffic="false"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:label="OTP Cepat"
              android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:configChanges="keyboard|keyboardHidden|orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > otpcepat/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#000000</item>
              <item name="android:colorAccent">#FFD633</item>
              <item name="android:windowNoTitle">true</item>
            </style>
            <color name="icon_bg">#000000</color>
          </resources>
          EOF

          # Reuse the proven OTP gold/black icon from the Litensi build.
          base64 -d assets/otp_final_icon.b64 > otpcepat/app/src/main/res/drawable-nodpi/otp_logo.png

          cat > otpcepat/app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <inset xmlns:android="http://schemas.android.com/apk/res/android" android:drawable="@drawable/otp_logo" android:inset="0dp"/>
          EOF
          cp otpcepat/app/src/main/res/mipmap-anydpi/ic_launcher.xml otpcepat/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          cat > otpcepat/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_bg"/>
            <foreground android:drawable="@drawable/otp_logo"/>
          </adaptive-icon>
          EOF
          cp otpcepat/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml otpcepat/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > otpcepat/app/src/main/java/com/riwutz/otpcepat/MainActivity.java <<'EOF'
          package com.riwutz.otpcepat;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private static final String HOME="https://otpcepat.org/dashboard";
            private static final String PREFS="otpcepat_state";
            private static final String LAST="last_url";
            private WebView web;
            private SharedPreferences prefs;
            private CookieManager cookies;

            @SuppressLint({"SetJavaScriptEnabled","JavascriptInterface"})
            @Override public void onCreate(Bundle b){
              super.onCreate(b);
              prefs=getSharedPreferences(PREFS,MODE_PRIVATE);

              web=new WebView(this);
              web.setBackgroundColor(Color.BLACK);
              web.setLayoutParams(new ViewGroup.LayoutParams(-1,-1));
              setContentView(web);

              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              s.setLoadsImagesAutomatically(true);
              s.setBlockNetworkLoads(false);
              s.setAllowContentAccess(true);
              s.setAllowFileAccess(true);
              s.setLoadWithOverviewMode(false);
              s.setUseWideViewPort(true);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              s.setDisplayZoomControls(false);
              s.setSaveFormData(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setJavaScriptCanOpenWindowsAutomatically(true);
              s.setSupportMultipleWindows(false);
              if(Build.VERSION.SDK_INT>=21) s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              if(Build.VERSION.SDK_INT>=26) s.setSafeBrowsingEnabled(true);
              // Keep the ROM's native Android System WebView user-agent unchanged.

              cookies=CookieManager.getInstance();
              cookies.setAcceptCookie(true);
              if(Build.VERSION.SDK_INT>=21) cookies.setAcceptThirdPartyCookies(web,true);

              web.addJavascriptInterface(new Bridge(),"OTPBridge");
              web.setWebChromeClient(new WebChromeClient());
              web.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){return route(r.getUrl().toString());}
                @Override public boolean shouldOverrideUrlLoading(WebView v,String u){return route(u);}
                @Override public void onPageFinished(WebView v,String u){
                  super.onPageFinished(v,u);
                  if(isOtpCepat(u)){
                    saveUrl(u);
                    injectHooks();
                  }
                  flushCookies();
                }
              });

              String start=prefs.getString(LAST,HOME);
              if(!isOtpCepat(start) || isAuth(start)) start=HOME;
              final String first=start;
              web.postDelayed(new Runnable(){public void run(){web.loadUrl(first);}},120);
            }

            private boolean isOtpCepat(String u){
              try{
                Uri x=Uri.parse(u);
                String h=x.getHost();
                return "https".equalsIgnoreCase(x.getScheme()) && h!=null && (h.equalsIgnoreCase("otpcepat.org") || h.toLowerCase().endsWith(".otpcepat.org"));
              }catch(Exception e){return false;}
            }

            private boolean isAuth(String u){
              String x=u==null?"":u.toLowerCase();
              return x.contains("/user_auth") || x.contains("/logout");
            }

            private boolean route(String u){
              try{
                Uri x=Uri.parse(u);
                String scheme=x.getScheme();
                if(scheme!=null && (scheme.equalsIgnoreCase("http") || scheme.equalsIgnoreCase("https"))) return false;
                startActivity(new Intent(Intent.ACTION_VIEW,x));
                return true;
              }catch(Exception ignored){return false;}
            }

            private void saveUrl(String u){
              if(isOtpCepat(u) && !isAuth(u)) prefs.edit().putString(LAST,u).apply();
            }

            private void flushCookies(){
              if(cookies!=null && Build.VERSION.SDK_INT>=21) cookies.flush();
            }

            private void injectHooks(){
              String js="(function(){try{"+
                "if(window.__otpCepatNative)return;window.__otpCepatNative=1;"+
                "function nativeCopy(t){try{OTPBridge.copyText(String(t==null?'':t));return Promise.resolve();}catch(e){return Promise.reject(e);}}"+
                "try{if(navigator.clipboard){try{Object.defineProperty(navigator.clipboard,'writeText',{value:nativeCopy,configurable:true});}catch(e){try{navigator.clipboard.writeText=nativeCopy;}catch(x){}}}else{Object.defineProperty(navigator,'clipboard',{value:{writeText:nativeCopy},configurable:true});}}catch(e){}"+
                "var oldExec=document.execCommand?document.execCommand.bind(document):null;if(oldExec){document.execCommand=function(c){if(String(c).toLowerCase()==='copy'){try{var a=document.activeElement,t='';if(a&&typeof a.value==='string'){var s=a.selectionStart,e=a.selectionEnd;if(typeof s==='number'&&typeof e==='number'&&e>s)t=a.value.substring(s,e);else t=a.value;}if(!t)t=String(window.getSelection?window.getSelection():'');if(t)OTPBridge.copyText(t);}catch(x){}}return oldExec.apply(document,arguments);};}"+
                "function save(){try{OTPBridge.saveUrl(location.href);}catch(e){}}"+
                "var ps=history.pushState,rs=history.replaceState;history.pushState=function(){var r=ps.apply(this,arguments);save();return r;};history.replaceState=function(){var r=rs.apply(this,arguments);save();return r;};"+
                "addEventListener('popstate',save);addEventListener('hashchange',save);addEventListener('pagehide',save);"+
                "}catch(e){}})();";
              if(Build.VERSION.SDK_INT>=19) web.evaluateJavascript(js,null); else web.loadUrl("javascript:"+js);
            }

            public class Bridge{
              @JavascriptInterface public void saveUrl(String u){saveUrl(u);flushCookies();}
              @JavascriptInterface public boolean copyText(String t){
                try{
                  ClipboardManager cb=(ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE);
                  if(cb==null)return false;
                  cb.setPrimaryClip(ClipData.newPlainText("OTP Cepat",t==null?"":t));
                  return true;
                }catch(Exception e){return false;}
              }
            }

            private void saveNow(){if(web!=null){saveUrl(web.getUrl());flushCookies();}}
            @Override protected void onPause(){saveNow();if(web!=null)web.onPause();super.onPause();}
            @Override protected void onStop(){saveNow();super.onStop();}
            @Override protected void onResume(){super.onResume();if(web!=null)web.onResume();}
            @Override public void onBackPressed(){if(web!=null&&web.canGoBack())web.goBack();else super.onBackPressed();}
            @Override protected void onDestroy(){saveNow();if(web!=null){web.stopLoading();web.destroy();web=null;}super.onDestroy();}
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd otpcepat
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OTP_Cepat_FINAL.apk"
          test -s "$GITHUB_WORKSPACE/OTP_Cepat_FINAL.apk"
          unzip -tq "$GITHUB_WORKSPACE/OTP_Cepat_FINAL.apk"
          sha256sum "$GITHUB_WORKSPACE/OTP_Cepat_FINAL.apk" > "$GITHUB_WORKSPACE/OTP_Cepat_FINAL.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: otp-cepat-final
          path: |
            OTP_Cepat_FINAL.apk
            OTP_Cepat_FINAL.sha256
          retention-days: 7

      - name: Commit APK output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OTP_Cepat_FINAL.apk OTP_Cepat_FINAL.sha256
          git commit -m 'OTP Cepat FINAL APK' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
