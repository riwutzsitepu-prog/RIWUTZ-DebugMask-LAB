name: Build OTP Litensi FINAL Browser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-otp-litensi-final-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf otpbrowser
          mkdir -p otpbrowser/app/src/main/java/com/riwutz/otpgecko
          mkdir -p otpbrowser/app/src/main/res/values
          mkdir -p otpbrowser/app/src/main/res/drawable otpbrowser/app/src/main/res/drawable-nodpi
          mkdir -p otpbrowser/app/src/main/res/mipmap-anydpi
          mkdir -p otpbrowser/app/src/main/res/mipmap-anydpi-v26

          cat > otpbrowser/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
              maven { url "https://maven.mozilla.org/maven2/" }
            }
          }
          rootProject.name='OTPLitensiFinalBrowser'
          include ':app'
          EOF

          cat > otpbrowser/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          EOF

          cat > otpbrowser/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          cat > otpbrowser/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
            namespace 'com.riwutz.otpgecko'
            compileSdk 36

            defaultConfig {
              applicationId 'com.riwutz.otpgecko'
              minSdk 26
              targetSdk 28
              versionCode 3
              versionName '1.2-geckoview-oldicon'
            }

            buildTypes {
              release {
                minifyEnabled false
                shrinkResources false
              }
            }

            splits {
              abi {
                enable true
                reset()
                include 'arm64-v8a'
                universalApk false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          dependencies {
            implementation "org.mozilla.geckoview:geckoview-nightly:153.0.20260606213347"
          }
          EOF

          cat > otpbrowser/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <queries>
              <intent>
                <action android:name="android.intent.action.VIEW"/>
                <data android:scheme="https"/>
              </intent>
            </queries>
            <application
              android:allowBackup="true"
              android:hardwareAccelerated="true"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:label="OTP"
              android:theme="@style/AppTheme">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > otpbrowser/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:windowNoTitle">true</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:windowBackground">#000000</item>
            </style>
            <color name="icon_bg">#000000</color>
          </resources>
          EOF

          # Exact previous OTP gold/black icon, already padded for launcher safe area.
          base64 -d assets/otp_final_icon.b64 > otpbrowser/app/src/main/res/drawable-nodpi/otp_logo.png

          cat > otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
            android:drawable="@drawable/otp_logo"
            android:inset="0dp"/>
          EOF
          cp otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher.xml otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          cat > otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_bg"/>
            <foreground android:drawable="@drawable/otp_logo"/>
          </adaptive-icon>
          EOF
          cp otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > otpbrowser/app/src/main/java/com/riwutz/otpgecko/MainActivity.java <<'EOF'
          package com.riwutz.otpgecko;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.ViewGroup;

          import org.mozilla.geckoview.GeckoRuntime;
          import org.mozilla.geckoview.GeckoSession;
          import org.mozilla.geckoview.GeckoView;

          import java.util.List;

          public class MainActivity extends Activity {
            private static final String HOME = "https://litensi.id/";
            private static final String PREFS = "otp_gecko";
            private static final String LAST = "last_url";

            private static GeckoRuntime runtime;
            private GeckoSession session;
            private GeckoView view;
            private SharedPreferences prefs;
            private boolean canGoBack = false;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              prefs = getSharedPreferences(PREFS, MODE_PRIVATE);

              view = new GeckoView(this);
              view.setBackgroundColor(Color.BLACK);
              view.setLayoutParams(new ViewGroup.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT));
              setContentView(view);

              if (runtime == null) {
                runtime = GeckoRuntime.create(this);
              }

              session = new GeckoSession();
              session.setContentDelegate(new GeckoSession.ContentDelegate() {});
              session.setNavigationDelegate(new GeckoSession.NavigationDelegate() {
                @Override
                public void onCanGoBack(GeckoSession s, boolean value) {
                  canGoBack = value;
                }

                @Override
                public void onLocationChange(
                    GeckoSession s,
                    String url,
                    List<GeckoSession.PermissionDelegate.ContentPermission> perms,
                    Boolean hasUserGesture) {
                  if (isNormalLitensi(url)) {
                    prefs.edit().putString(LAST, url).apply();
                  }
                }
              });

              session.open(runtime);
              view.setSession(session);

              String start = prefs.getString(LAST, HOME);
              if (!isNormalLitensi(start)) start = HOME;
              session.loadUri(start);
            }

            private boolean isNormalLitensi(String url) {
              if (url == null) return false;
              try {
                android.net.Uri u = android.net.Uri.parse(url);
                String host = u.getHost();
                if (!"https".equalsIgnoreCase(u.getScheme()) || host == null) return false;
                boolean domain = host.equalsIgnoreCase("litensi.id")
                    || host.toLowerCase().endsWith(".litensi.id");
                if (!domain) return false;
                String lower = url.toLowerCase();
                return !lower.contains("/cdn-cgi/") && !lower.contains("challenge-platform");
              } catch (Exception e) {
                return false;
              }
            }

            @Override
            public void onBackPressed() {
              if (session != null && canGoBack) {
                session.goBack();
              } else {
                super.onBackPressed();
              }
            }

            @Override
            protected void onDestroy() {
              if (session != null) {
                session.close();
                session = null;
              }
              super.onDestroy();
            }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd otpbrowser
          gradle --no-daemon :app:assembleDebug
          APK_SRC=$(find app/build/outputs/apk/debug -type f -name '*arm64-v8a*debug.apk' | head -n1)
          test -n "$APK_SRC"
          cp "$APK_SRC" "$GITHUB_WORKSPACE/OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.apk"
          test -s "$GITHUB_WORKSPACE/OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.apk"
          unzip -tq "$GITHUB_WORKSPACE/OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.apk"
          sha256sum "$GITHUB_WORKSPACE/OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.apk" > "$GITHUB_WORKSPACE/OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: otp-litensi-geckoview-a11-arm64-oldicon
          path: |
            OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.apk
            OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.sha256
          retention-days: 7

      - name: Verify final output
        shell: bash
        run: |
          set -euo pipefail
          test -s OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.apk
          unzip -tq OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.apk
          grep -q '^' OTP_Litensi_GECKOVIEW_A11_ARM64_OLDICON.sha256
