name: Build OTP Litensi FINAL Browser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-otp-litensi-final-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf otpbrowser
          mkdir -p otpbrowser/app/src/main/java/com/riwutz/otpbrowserfinal
          mkdir -p otpbrowser/app/src/main/res/values
          mkdir -p otpbrowser/app/src/main/res/drawable
          mkdir -p otpbrowser/app/src/main/res/mipmap-anydpi
          mkdir -p otpbrowser/app/src/main/res/mipmap-anydpi-v26

          cat > otpbrowser/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name='OTPLitensiFinalBrowser'
          include ':app'
          EOF

          cat > otpbrowser/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > otpbrowser/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          cat > otpbrowser/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
            namespace 'com.riwutz.otpbrowserfinal'
            compileSdk 36

            defaultConfig {
              applicationId 'com.riwutz.otpbrowserfinal'
              minSdk 23
              targetSdk 35
              versionCode 1
              versionName '1.0-final-browser'
            }

            buildTypes {
              release {
                minifyEnabled false
                shrinkResources false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          EOF

          cat > otpbrowser/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <queries>
              <intent>
                <action android:name="android.intent.action.VIEW"/>
                <category android:name="android.intent.category.BROWSABLE"/>
                <data android:scheme="https"/>
              </intent>
            </queries>
            <application
              android:allowBackup="true"
              android:hardwareAccelerated="true"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:label="OTP"
              android:theme="@style/AppTheme">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > otpbrowser/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:windowNoTitle">true</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:windowBackground">#000000</item>
            </style>
            <color name="icon_bg">#000000</color>
          </resources>
          EOF

          cat > otpbrowser/app/src/main/res/drawable/otp_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#000000" android:strokeColor="#FFD633" android:strokeWidth="4"
              android:pathData="M54,4 A50,50 0,1 1,53.9 4"/>
            <path android:fillColor="#141414" android:strokeColor="#FFD633" android:strokeWidth="2.5"
              android:pathData="M54,20 L78,29 L75,62 C73,77 64,87 54,92 C44,87 35,77 33,62 L30,29 Z"/>
            <path android:fillColor="#FFD633"
              android:pathData="M47,31 L47,26 C47,21 50,18 54,18 C58,18 61,21 61,26 L61,31 L64,31 L64,42 L44,42 L44,31 Z M50,31 L58,31 L58,26 C58,23.5 56.5,22 54,22 C51.5,22 50,23.5 50,26 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFD633" android:strokeWidth="4" android:strokeLineCap="round"
              android:pathData="M27,50 C21,50 18,54 18,60 C18,66 21,70 27,70 C33,70 36,66 36,60 C36,54 33,50 27,50 Z M42,50 L60,50 M51,50 L51,70 M66,70 L66,50 L76,50 C82,50 85,53 85,58 C85,63 82,66 76,66 L66,66"/>
          </vector>
          EOF

          cat > otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
            android:drawable="@drawable/otp_logo"
            android:inset="10dp"/>
          EOF
          cp otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher.xml otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          cat > otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_bg"/>
            <foreground android:drawable="@drawable/otp_logo"/>
          </adaptive-icon>
          EOF
          cp otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > otpbrowser/app/src/main/java/com/riwutz/otpbrowserfinal/MainActivity.java <<'EOF'
          package com.riwutz.otpbrowserfinal;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Toast;

          public class MainActivity extends Activity {
            private static final String HOME = "https://litensi.id/";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              openLitensi();
            }

            private void openLitensi() {
              Uri uri = Uri.parse(HOME);
              Intent i = new Intent(Intent.ACTION_VIEW, uri);
              i.addCategory(Intent.CATEGORY_BROWSABLE);
              try {
                startActivity(i);
                finishAndRemoveTask();
              } catch (ActivityNotFoundException e) {
                Toast.makeText(this, "Browser tidak ditemukan", Toast.LENGTH_LONG).show();
                finish();
              } catch (Exception e) {
                Toast.makeText(this, "Tidak dapat membuka Litensi", Toast.LENGTH_LONG).show();
                finish();
              }
            }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd otpbrowser
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OTP_Litensi_FINAL_DEFAULT_BROWSER.apk"
          test -s "$GITHUB_WORKSPACE/OTP_Litensi_FINAL_DEFAULT_BROWSER.apk"
          unzip -tq "$GITHUB_WORKSPACE/OTP_Litensi_FINAL_DEFAULT_BROWSER.apk"
          sha256sum "$GITHUB_WORKSPACE/OTP_Litensi_FINAL_DEFAULT_BROWSER.apk" > "$GITHUB_WORKSPACE/OTP_Litensi_FINAL_DEFAULT_BROWSER.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: otp-litensi-final-default-browser
          path: |
            OTP_Litensi_FINAL_DEFAULT_BROWSER.apk
            OTP_Litensi_FINAL_DEFAULT_BROWSER.sha256
          retention-days: 7

      - name: Commit APK output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OTP_Litensi_FINAL_DEFAULT_BROWSER.apk OTP_Litensi_FINAL_DEFAULT_BROWSER.sha256
          git commit -m 'OTP Litensi FINAL default-browser APK' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
