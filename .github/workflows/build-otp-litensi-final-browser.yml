name: Build OTP Litensi FINAL Browser

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-otp-litensi-final-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf otpbrowser
          mkdir -p otpbrowser/app/src/main/java/com/riwutz/otpbrowserfinal
          mkdir -p otpbrowser/app/src/main/res/values
          mkdir -p otpbrowser/app/src/main/res/drawable
          mkdir -p otpbrowser/app/src/main/res/mipmap-anydpi
          mkdir -p otpbrowser/app/src/main/res/mipmap-anydpi-v26

          cat > otpbrowser/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name='OTPLitensiFinalBrowser'
          include ':app'
          EOF

          cat > otpbrowser/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > otpbrowser/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          cat > otpbrowser/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
            namespace 'com.riwutz.otpbrowserfinal'
            compileSdk 36

            defaultConfig {
              applicationId 'com.riwutz.otpbrowserfinal'
              minSdk 23
              targetSdk 28
              versionCode 4
              versionName '1.3-pure-webview-a11'
            }

            buildTypes {
              release {
                minifyEnabled false
                shrinkResources false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
          }
          EOF

          cat > otpbrowser/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <queries>
              <intent>
                <action android:name="android.intent.action.VIEW"/>
                <data android:scheme="https"/>
              </intent>
            </queries>
            <application
              android:allowBackup="true"
              android:hardwareAccelerated="true"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:label="OTP"
              android:theme="@style/AppTheme">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > otpbrowser/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:windowNoTitle">true</item>
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:windowBackground">#000000</item>
            </style>
            <color name="icon_bg">#000000</color>
          </resources>
          EOF

          cat > otpbrowser/app/src/main/res/drawable/otp_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#000000" android:strokeColor="#FFD633" android:strokeWidth="4"
              android:pathData="M54,4 A50,50 0,1 1,53.9 4"/>
            <path android:fillColor="#141414" android:strokeColor="#FFD633" android:strokeWidth="2.5"
              android:pathData="M54,20 L78,29 L75,62 C73,77 64,87 54,92 C44,87 35,77 33,62 L30,29 Z"/>
            <path android:fillColor="#FFD633"
              android:pathData="M47,31 L47,26 C47,21 50,18 54,18 C58,18 61,21 61,26 L61,31 L64,31 L64,42 L44,42 L44,31 Z M50,31 L58,31 L58,26 C58,23.5 56.5,22 54,22 C51.5,22 50,23.5 50,26 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFD633" android:strokeWidth="4" android:strokeLineCap="round"
              android:pathData="M27,50 C21,50 18,54 18,60 C18,66 21,70 27,70 C33,70 36,66 36,60 C36,54 33,50 27,50 Z M42,50 L60,50 M51,50 L51,70 M66,70 L66,50 L76,50 C82,50 85,53 85,58 C85,63 82,66 76,66 L66,66"/>
          </vector>
          EOF

          cat > otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
            android:drawable="@drawable/otp_logo"
            android:inset="10dp"/>
          EOF
          cp otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher.xml otpbrowser/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          cat > otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_bg"/>
            <foreground android:drawable="@drawable/otp_logo"/>
          </adaptive-icon>
          EOF
          cp otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml otpbrowser/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > otpbrowser/app/src/main/java/com/riwutz/otpbrowserfinal/MainActivity.java <<'EOF'
          package com.riwutz.otpbrowserfinal;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private static final String HOME = "https://litensi.id/";
            private static final String PREFS = "otp_webview11";
            private static final String LAST = "last_url";
            private WebView web;
            private CookieManager cookies;
            private SharedPreferences prefs;

            @SuppressLint("SetJavaScriptEnabled")
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              prefs = getSharedPreferences(PREFS, MODE_PRIVATE);

              web = new WebView(this);
              web.setBackgroundColor(Color.BLACK);
              web.setLayoutParams(new ViewGroup.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT));
              setContentView(web);

              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setLoadsImagesAutomatically(true);
              s.setBlockNetworkLoads(false);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              s.setDisplayZoomControls(false);
              s.setSaveFormData(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setJavaScriptCanOpenWindowsAutomatically(true);
              s.setSupportMultipleWindows(false);

              // Important for Cloudflare: keep Android System WebView's native UA unchanged.
              String nativeUa = s.getUserAgentString();
              s.setUserAgentString(nativeUa);

              if (Build.VERSION.SDK_INT >= 21) {
                s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              }
              if (Build.VERSION.SDK_INT >= 26) {
                s.setSafeBrowsingEnabled(true);
              }

              cookies = CookieManager.getInstance();
              cookies.setAcceptCookie(true);
              if (Build.VERSION.SDK_INT >= 21) {
                cookies.setAcceptThirdPartyCookies(web, true);
              }

              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  return handle(request.getUrl().toString());
                }

                @Override
                public boolean shouldOverrideUrlLoading(WebView view, String url) {
                  return handle(url);
                }

                @Override
                public void onPageFinished(WebView view, String url) {
                  super.onPageFinished(view, url);
                  if (isNormalLitensi(url)) {
                    prefs.edit().putString(LAST, url).apply();
                  }
                  flushCookies();
                }
              });

              String start = prefs.getString(LAST, HOME);
              if (!isNormalLitensi(start)) start = HOME;
              web.loadUrl(start);
            }

            private boolean isNormalLitensi(String url) {
              try {
                Uri u = Uri.parse(url);
                String host = u.getHost();
                if (!"https".equalsIgnoreCase(u.getScheme()) || host == null) return false;
                boolean domain = host.equalsIgnoreCase("litensi.id") || host.toLowerCase().endsWith(".litensi.id");
                if (!domain) return false;
                String lower = url.toLowerCase();
                return !lower.contains("/cdn-cgi/") && !lower.contains("challenge-platform");
              } catch (Exception e) {
                return false;
              }
            }

            private boolean handle(String url) {
              try {
                Uri u = Uri.parse(url);
                String scheme = u.getScheme();
                if (scheme == null) return false;
                if (scheme.equalsIgnoreCase("http") ||
                    scheme.equalsIgnoreCase("https") ||
                    scheme.equalsIgnoreCase("about")) {
                  return false;
                }
                try {
                  startActivity(new Intent(Intent.ACTION_VIEW, u));
                  return true;
                } catch (Exception ignored) {
                  return true;
                }
              } catch (Exception e) {
                return false;
              }
            }

            private void flushCookies() {
              if (cookies != null && Build.VERSION.SDK_INT >= 21) {
                cookies.flush();
              }
            }

            @Override
            protected void onPause() {
              flushCookies();
              if (web != null) web.onPause();
              super.onPause();
            }

            @Override
            protected void onStop() {
              flushCookies();
              super.onStop();
            }

            @Override
            protected void onResume() {
              super.onResume();
              if (web != null) web.onResume();
            }

            @Override
            public void onBackPressed() {
              if (web != null && web.canGoBack()) {
                web.goBack();
              } else {
                super.onBackPressed();
              }
            }

            @Override
            protected void onDestroy() {
              flushCookies();
              if (web != null) {
                web.stopLoading();
                web.destroy();
                web = null;
              }
              super.onDestroy();
            }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd otpbrowser
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OTP_Litensi_PURE_WEBVIEW_A11.apk"
          test -s "$GITHUB_WORKSPACE/OTP_Litensi_PURE_WEBVIEW_A11.apk"
          unzip -tq "$GITHUB_WORKSPACE/OTP_Litensi_PURE_WEBVIEW_A11.apk"
          sha256sum "$GITHUB_WORKSPACE/OTP_Litensi_PURE_WEBVIEW_A11.apk" > "$GITHUB_WORKSPACE/OTP_Litensi_PURE_WEBVIEW_A11.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: otp-litensi-pure-webview-a11
          path: |
            OTP_Litensi_PURE_WEBVIEW_A11.apk
            OTP_Litensi_PURE_WEBVIEW_A11.sha256
          retention-days: 7

      - name: Commit APK output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OTP_Litensi_PURE_WEBVIEW_A11.apk OTP_Litensi_PURE_WEBVIEW_A11.sha256
          git commit -m 'OTP Litensi PURE WebView A11 APK' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
