name: Build OTP Cepat V5 Blue Ring Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-otpcepat-v5-blue-ring.yml'
      - 'assets/otp_v5_blue_ring_120.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool
          apktool --version

      - name: Patch V4 icon to V5 blue ring
        shell: bash
        run: |
          set -euo pipefail
          test -s OTP_Cepat_V4_ANTI_LOGOUT.apk
          rm -rf otp_v5_decoded otp_v5_unsigned.apk otp_v5_aligned.apk
          apktool d -f OTP_Cepat_V4_ANTI_LOGOUT.apk -o otp_v5_decoded

          mkdir -p otp_v5_decoded/res/drawable-nodpi
          base64 --decode --ignore-garbage assets/otp_v5_blue_ring_120.b64 > otp_v5_decoded/res/drawable-nodpi/otp_v5_blue_ring.png
          test -s otp_v5_decoded/res/drawable-nodpi/otp_v5_blue_ring.png
          file otp_v5_decoded/res/drawable-nodpi/otp_v5_blue_ring.png | grep -q 'PNG image data'

          # Keep the existing V3/V4 12dp launcher inset, but replace the inner artwork
          # with the user's selected blue neon ring logo.
          cat > otp_v5_decoded/res/drawable/otp_blue.xml <<'EOF'
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
            android:src="@drawable/otp_v5_blue_ring"
            android:gravity="fill" />
          EOF

          # Bump visible version metadata where apktool exposes it.
          sed -i "s/versionCode: '4'/versionCode: '5'/" otp_v5_decoded/apktool.yml || true
          sed -i 's/versionName: 4.0-anti-logout/versionName: 5.0-blue-ring-fix/' otp_v5_decoded/apktool.yml || true

          apktool b otp_v5_decoded -o otp_v5_unsigned.apk
          test -s otp_v5_unsigned.apk

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -f -p 4 otp_v5_unsigned.apk otp_v5_aligned.apk

          keytool -genkeypair -v \
            -keystore otp-v5.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US'

          "$APKSIGNER" sign \
            --ks otp-v5.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out OTP_Cepat_V5_BLUE_RING_FIX.apk \
            otp_v5_aligned.apk

          "$APKSIGNER" verify --verbose --print-certs OTP_Cepat_V5_BLUE_RING_FIX.apk
          unzip -tq OTP_Cepat_V5_BLUE_RING_FIX.apk
          sha256sum OTP_Cepat_V5_BLUE_RING_FIX.apk > OTP_Cepat_V5_BLUE_RING_FIX.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: otp-cepat-v5-blue-ring-fix
          path: |
            OTP_Cepat_V5_BLUE_RING_FIX.apk
            OTP_Cepat_V5_BLUE_RING_FIX.sha256
          retention-days: 7

      - name: Commit APK output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OTP_Cepat_V5_BLUE_RING_FIX.apk OTP_Cepat_V5_BLUE_RING_FIX.sha256
          git commit -m 'OTP Cepat V5 blue ring fix' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
