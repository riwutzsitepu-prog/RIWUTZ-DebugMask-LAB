name: Export V5 APK Artifact
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v5-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: otp-v5-apk
          path: OTP_Litensi_V5_FAST_CLIPBOARD.apk
          if-no-files-found: error
          compression-level: 0
