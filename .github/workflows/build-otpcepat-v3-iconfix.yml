name: Build OTP Cepat V3 Icon Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-otpcepat-v3-iconfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf otpcepat
          mkdir -p otpcepat/app/src/main/java/com/riwutz/otpcepat
          mkdir -p otpcepat/app/src/main/res/values otpcepat/app/src/main/res/drawable otpcepat/app/src/main/res/mipmap-anydpi otpcepat/app/src/main/res/mipmap-anydpi-v26

          cat > otpcepat/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='OTPCepatV3'
          include ':app'
          EOF

          cat > otpcepat/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > otpcepat/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.riwutz.otpcepat'
            compileSdk 35
            defaultConfig { applicationId 'com.riwutz.otpcepat'; minSdk 23; targetSdk 28; versionCode 3; versionName '3.0-blue-lock-small-icon' }
            buildTypes { release { minifyEnabled false; shrinkResources false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
          }
          EOF

          cat > otpcepat/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application
              android:allowBackup="true"
              android:hardwareAccelerated="true"
              android:usesCleartextTraffic="false"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:label="OTP Cepat"
              android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:configChanges="keyboard|keyboardHidden|orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > otpcepat/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:statusBarColor">#000000</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowBackground">#000000</item>
              <item name="android:colorAccent">#00A8FF</item>
              <item name="android:windowNoTitle">true</item>
            </style>
            <color name="icon_bg">#000000</color>
          </resources>
          EOF

          cat > otpcepat/app/src/main/res/drawable/otp_blue.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#05090F" android:strokeColor="#00A8FF" android:strokeWidth="4"
              android:pathData="M54,7 A47,47 0,1 1,53.9 7"/>
            <path android:fillColor="#071827" android:strokeColor="#00D4FF" android:strokeWidth="2.7"
              android:pathData="M54,20 L78,29 L75,62 C73,77 64,87 54,92 C44,87 35,77 33,62 L30,29 Z"/>
            <path android:fillColor="#00A8FF"
              android:pathData="M47,32 L47,27 C47,22 50,19 54,19 C58,19 61,22 61,27 L61,32 L65,32 L65,43 L43,43 L43,32 Z M50,32 L58,32 L58,27 C58,24.5 56.5,23 54,23 C51.5,23 50,24.5 50,27 Z"/>
            <path android:fillColor="#00000000" android:strokeColor="#00D4FF" android:strokeWidth="4" android:strokeLineCap="round"
              android:pathData="M27,50 C21,50 18,54 18,60 C18,66 21,70 27,70 C33,70 36,66 36,60 C36,54 33,50 27,50 Z M42,50 L60,50 M51,50 L51,70 M66,70 L66,50 L76,50 C82,50 85,53 85,58 C85,63 82,66 76,66 L66,66"/>
            <path android:fillColor="#00000000" android:strokeColor="#58E4FF" android:strokeWidth="2.2" android:strokeLineCap="round"
              android:pathData="M39,79 L47,79 L50,74 L54,84 L59,76 L62,79 L70,79"/>
          </vector>
          EOF

          # V3: same blue logo, but shrink the foreground on BOTH legacy and adaptive launchers.
          cat > otpcepat/app/src/main/res/drawable/otp_blue_inset.xml <<'EOF'
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
            android:drawable="@drawable/otp_blue"
            android:inset="12dp"/>
          EOF

          cat > otpcepat/app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <inset xmlns:android="http://schemas.android.com/apk/res/android" android:drawable="@drawable/otp_blue" android:inset="12dp"/>
          EOF
          cp otpcepat/app/src/main/res/mipmap-anydpi/ic_launcher.xml otpcepat/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          cat > otpcepat/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_bg"/>
            <foreground android:drawable="@drawable/otp_blue_inset"/>
          </adaptive-icon>
          EOF
          cp otpcepat/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml otpcepat/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat > otpcepat/app/src/main/java/com/riwutz/otpcepat/MainActivity.java <<'EOF'
          package com.riwutz.otpcepat;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
            private static final String HOME="https://otpcepat.org/dashboard";
            private static final String PREFS="otpcepat_state";
            private static final String LAST="last_url";
            private WebView web;
            private SharedPreferences prefs;
            private CookieManager cookies;

            @SuppressLint({"SetJavaScriptEnabled","JavascriptInterface"})
            @Override public void onCreate(Bundle b){
              super.onCreate(b);
              prefs=getSharedPreferences(PREFS,MODE_PRIVATE);
              web=new WebView(this);
              web.setBackgroundColor(Color.BLACK);
              web.setLayoutParams(new ViewGroup.LayoutParams(-1,-1));
              setContentView(web);

              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              s.setCacheMode(WebSettings.LOAD_DEFAULT);
              s.setLoadsImagesAutomatically(true);
              s.setBlockNetworkLoads(false);
              s.setAllowContentAccess(true);
              s.setAllowFileAccess(true);
              s.setLoadWithOverviewMode(false);
              s.setUseWideViewPort(true);
              s.setSupportZoom(false);
              s.setBuiltInZoomControls(false);
              s.setDisplayZoomControls(false);
              s.setSaveFormData(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setJavaScriptCanOpenWindowsAutomatically(true);
              s.setSupportMultipleWindows(false);
              if(Build.VERSION.SDK_INT>=21) s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
              if(Build.VERSION.SDK_INT>=26) s.setSafeBrowsingEnabled(true);

              cookies=CookieManager.getInstance();
              cookies.setAcceptCookie(true);
              if(Build.VERSION.SDK_INT>=21) cookies.setAcceptThirdPartyCookies(web,true);

              web.addJavascriptInterface(new Bridge(),"OTPBridge");
              web.setWebChromeClient(new WebChromeClient());
              web.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){return route(r.getUrl().toString());}
                @Override public boolean shouldOverrideUrlLoading(WebView v,String u){return route(u);}
                @Override public void onPageFinished(WebView v,String u){
                  super.onPageFinished(v,u);
                  if(isOtpCepat(u)){
                    saveUrl(u);
                    injectHooks();
                  }
                  flushCookies();
                }
              });

              String start=prefs.getString(LAST,HOME);
              if(!isOtpCepat(start) || isAuth(start)) start=HOME;
              final String first=start;
              web.postDelayed(new Runnable(){public void run(){web.loadUrl(first);}},120);
            }

            private boolean isOtpCepat(String u){
              try{
                Uri x=Uri.parse(u);
                String h=x.getHost();
                return "https".equalsIgnoreCase(x.getScheme()) && h!=null && (h.equalsIgnoreCase("otpcepat.org") || h.toLowerCase().endsWith(".otpcepat.org"));
              }catch(Exception e){return false;}
            }

            private boolean isAuth(String u){
              String x=u==null?"":u.toLowerCase();
              return x.contains("/user_auth") || x.contains("/logout");
            }

            private boolean route(String u){
              try{
                Uri x=Uri.parse(u);
                String scheme=x.getScheme();
                if(scheme!=null && (scheme.equalsIgnoreCase("http") || scheme.equalsIgnoreCase("https"))) return false;
                startActivity(new Intent(Intent.ACTION_VIEW,x));
                return true;
              }catch(Exception ignored){return false;}
            }

            private void saveUrl(String u){if(isOtpCepat(u) && !isAuth(u)) prefs.edit().putString(LAST,u).apply();}
            private void flushCookies(){if(cookies!=null && Build.VERSION.SDK_INT>=21) cookies.flush();}

            private void injectHooks(){
              String js="(function(){try{"+
                "if(window.__otpCepatV3)return;window.__otpCepatV3=1;"+
                "function nativeCopy(t){try{OTPBridge.copyText(String(t==null?'':t));return Promise.resolve();}catch(e){return Promise.reject(e);}}"+
                "try{if(navigator.clipboard){try{Object.defineProperty(navigator.clipboard,'writeText',{value:nativeCopy,configurable:true});}catch(e){try{navigator.clipboard.writeText=nativeCopy;}catch(x){}}}else{Object.defineProperty(navigator,'clipboard',{value:{writeText:nativeCopy},configurable:true});}}catch(e){}"+
                "var oldExec=document.execCommand?document.execCommand.bind(document):null;if(oldExec){document.execCommand=function(c){if(String(c).toLowerCase()==='copy'){try{var a=document.activeElement,t='';if(a&&typeof a.value==='string'){var s=a.selectionStart,e=a.selectionEnd;if(typeof s==='number'&&typeof e==='number'&&e>s)t=a.value.substring(s,e);else t=a.value;}if(!t)t=String(window.getSelection?window.getSelection():'');if(t)OTPBridge.copyText(t);}catch(x){}}return oldExec.apply(document,arguments);};}"+
                "function chooseTikTok(){try{var sels=document.querySelectorAll('select');for(var i=0;i<sels.length;i++){var s=sels[i],opts=s.options||[],hit=null;for(var j=0;j<opts.length;j++){if(/tiktok/i.test((opts[j].textContent||opts[j].innerText||''))){hit=opts[j];break;}}if(hit){if(s.value!==hit.value){s.value=hit.value;s.dispatchEvent(new Event('input',{bubbles:true}));s.dispatchEvent(new Event('change',{bubbles:true}));try{if(window.jQuery)window.jQuery(s).val(hit.value).trigger('change');}catch(e){}}s.setAttribute('data-otp-tiktok-lock','1');}}var locked=document.querySelectorAll('select[data-otp-tiktok-lock=\"1\"]');for(var k=0;k<locked.length;k++){var el=locked[k];if(el.__otpLockBound)continue;el.__otpLockBound=1;el.addEventListener('change',function(){var q=this;setTimeout(function(){var os=q.options||[],h=null;for(var z=0;z<os.length;z++){if(/tiktok/i.test(os[z].textContent||'')){h=os[z];break;}}if(h&&q.value!==h.value){q.value=h.value;q.dispatchEvent(new Event('input',{bubbles:true}));q.dispatchEvent(new Event('change',{bubbles:true}));try{if(window.jQuery)window.jQuery(q).val(h.value).trigger('change');}catch(e){}}},0);},true);}}catch(e){}}"+
                "function markOtp(){try{var nodes=document.querySelectorAll('td,span,div,a,button');for(var i=0;i<nodes.length;i++){var n=nodes[i];if(n.children&&n.children.length>0)continue;var t=(n.textContent||'').trim();if(/^\\d{4,8}$/.test(t)){n.setAttribute('data-otp-copy-code',t);n.style.cursor='pointer';}}}catch(e){}}"+
                "document.addEventListener('click',function(ev){try{var n=ev.target;for(var d=0;d<4&&n;d++,n=n.parentElement){var c=n.getAttribute&&n.getAttribute('data-otp-copy-code');if(c&&/^\\d{4,8}$/.test(c)){OTPBridge.copyText(c);ev.preventDefault();ev.stopPropagation();return;}}var x=ev.target&&((ev.target.textContent||'').trim());if(/^\\d{4,8}$/.test(x)){OTPBridge.copyText(x);}}catch(e){}},true);"+
                "function refresh(){chooseTikTok();markOtp();try{OTPBridge.saveUrl(location.href);}catch(e){}}"+
                "var mo=new MutationObserver(function(){clearTimeout(window.__otpCepatRefresh);window.__otpCepatRefresh=setTimeout(refresh,120);});mo.observe(document.documentElement||document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['value','class']});"+
                "setInterval(chooseTikTok,1200);setInterval(markOtp,1500);setTimeout(refresh,100);setTimeout(refresh,800);setTimeout(refresh,2200);"+
                "var ps=history.pushState,rs=history.replaceState;history.pushState=function(){var r=ps.apply(this,arguments);setTimeout(refresh,100);return r;};history.replaceState=function(){var r=rs.apply(this,arguments);setTimeout(refresh,100);return r;};"+
                "addEventListener('popstate',refresh);addEventListener('hashchange',refresh);addEventListener('pagehide',function(){try{OTPBridge.saveUrl(location.href);}catch(e){}});"+
                "}catch(e){}})();";
              if(Build.VERSION.SDK_INT>=19) web.evaluateJavascript(js,null); else web.loadUrl("javascript:"+js);
            }

            public class Bridge{
              @JavascriptInterface public void saveUrl(String u){saveUrl(u);flushCookies();}
              @JavascriptInterface public boolean copyText(final String t){
                try{
                  ClipboardManager cb=(ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE);
                  if(cb==null)return false;
                  final String text=t==null?"":t.trim();
                  cb.setPrimaryClip(ClipData.newPlainText("OTP Cepat",text));
                  runOnUiThread(new Runnable(){public void run(){Toast.makeText(MainActivity.this,"Disalin: "+text,Toast.LENGTH_SHORT).show();}});
                  return true;
                }catch(Exception e){return false;}
              }
            }

            private void saveNow(){if(web!=null){saveUrl(web.getUrl());flushCookies();}}
            @Override protected void onPause(){saveNow();if(web!=null)web.onPause();super.onPause();}
            @Override protected void onStop(){saveNow();super.onStop();}
            @Override protected void onResume(){super.onResume();if(web!=null)web.onResume();}
            @Override public void onBackPressed(){if(web!=null&&web.canGoBack())web.goBack();else super.onBackPressed();}
            @Override protected void onDestroy(){saveNow();if(web!=null){web.stopLoading();web.destroy();web=null;}super.onDestroy();}
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd otpcepat
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.apk"
          test -s "$GITHUB_WORKSPACE/OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.apk"
          unzip -tq "$GITHUB_WORKSPACE/OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.apk"
          sha256sum "$GITHUB_WORKSPACE/OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.apk" > "$GITHUB_WORKSPACE/OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: otp-cepat-v3-tiktok-lock-blue-icon-fix
          path: |
            OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.apk
            OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.sha256
          retention-days: 7

      - name: Commit APK output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.apk OTP_Cepat_V3_TIKTOK_LOCK_BLUE_ICON_FIX.sha256
          git commit -m 'OTP Cepat V3 blue icon size fix' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
